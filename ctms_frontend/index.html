<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CTMS · Department of Materials Engineering, Example University</title>

    <!-- Fonts: IBM Plex Sans (UI) + IBM Plex Mono (data / lot numbers / measurements) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon: hexagon "sample cross-section" mark -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 93,27 93,73 50,96 7,73 7,27' fill='%231B1E24'/%3E%3Cpolygon points='50,4 93,27 93,73 50,96 7,73 7,27' fill='none' stroke='%23C2703D' stroke-width='5'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23C2703D'/%3E%3C/svg%3E">

    <style>
      /* ════════════════════════════════════════════════════════
         CTMS — Global Reset & Design Tokens
         Palette: Graphite / Copper / Teal / Paper
         (grounded in materials testing: tempered steel,
          heat-treated copper, spectrometer readouts,
          lab report paper)
         ════════════════════════════════════════════════════════ */

      :root {
        --ink:          #1B1E24;
        --ink-soft:     #262B33;
        --ink-softer:   #323844;
        --copper:       #C2703D;
        --copper-light: #E0A172;
        --copper-dim:   #8C5430;
        --teal:         #2A9D8F;
        --teal-light:   #CFEDE9;
        --amber:        #D9A23B;
        --amber-light:  #FBF1DD;
        --rust:         #C1493D;
        --rust-light:   #FAE3DF;
        --paper:        #F7F5F1;
        --paper-card:   #FFFFFF;
        --border:       #E5E0D8;
        --text:         #1B1E24;
        --text-muted:   #786F63;
        --text-soft:    #A39A8D;

        --font-ui:   'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
        --font-mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
      }

      /* ── Reset ────────────────────────────────────────────── */
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-ui);
        background: var(--ink);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* The React app mounts here. No flex/centering —
         Dashboard.jsx and App.jsx control their own full-bleed
         layout via CSS Grid. This prevents the "shrunk to one
         side with blank space" bug permanently: #root simply
         fills the viewport and gets out of the way. */
      #root {
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      /* ── Scrollbars ───────────────────────────────────────── */
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--text-soft);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--copper-dim); }

      /* ── Focus visibility (accessibility) ────────────────── */
      input:focus-visible, select:focus-visible,
      textarea:focus-visible, button:focus-visible {
        outline: 2px solid var(--copper);
        outline-offset: 1px;
      }

      /* ── Buttons: subtle lift on hover ──────────────────────
         Applies to inline-styled buttons too, since this is a
         type-level selector with low specificity — any inline
         style or component-level style can override it. */
      button {
        font-family: inherit;
        transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
      }
      button:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }
      button:active:not(:disabled) {
        transform: translateY(0);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
        transform: none;
      }

      /* ── Page-load animation ─────────────────────────────────
         A single orchestrated entrance — not scattered effects.
         Used by the login card and the dashboard shell. */
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .ctms-rise   { animation: riseIn 0.5s cubic-bezier(.22,.9,.34,1) both; }
      .ctms-fade   { animation: fadeIn 0.4s ease both; }

      /* Login-only materials lab backdrop. Decorative layers never intercept input. */
      .ctms-lab-scene {
        position: absolute; inset: 0; overflow: hidden; pointer-events: none;
        isolation: isolate; z-index: 0;
        background:
          radial-gradient(ellipse at 18% 18%, rgba(42,157,143,.34), transparent 40%),
          radial-gradient(ellipse at 82% 78%, rgba(194,112,61,.3), transparent 42%),
          radial-gradient(ellipse at 78% 16%, rgba(72,133,204,.23), transparent 34%),
          linear-gradient(135deg, #262B33 0%, #1B1E24 52%, #14171C 100%);
      }
      .ctms-lab-scene::before, .ctms-lab-scene::after {
        content: ''; position: absolute; inset: 0; pointer-events: none;
      }
      .ctms-lab-scene::before {
        opacity: .33;
        background-image: radial-gradient(rgba(247,245,241,.42) .7px, transparent .9px);
        background-size: 31px 31px;
        mask-image: linear-gradient(110deg, #000, transparent 72%);
      }
      .ctms-lab-scene::after {
        opacity: .38;
        background: linear-gradient(90deg, transparent 49.9%, rgba(224,161,114,.35) 50%, transparent 50.1%),
                    linear-gradient(0deg, transparent 49.9%, rgba(224,161,114,.22) 50%, transparent 50.1%);
        background-size: 100px 100px;
        mask-image: radial-gradient(ellipse at 50% 48%, #000, transparent 74%);
      }
      .ctms-lab-glow {
        position: absolute; width: 40vw; height: 40vw; min-width: 380px; min-height: 380px;
        left: -10vw; top: -20vw; border-radius: 50%;
        background: rgba(42,157,143,.23); filter: blur(72px);
        animation: labBreathe 12s ease-in-out infinite alternate;
      }
      .ctms-lab-grid {
        position: absolute; left: -15%; right: -15%; bottom: -53%; height: 88%;
        transform: perspective(520px) rotateX(62deg); transform-origin: center top;
        background-image: linear-gradient(rgba(75,224,198,.34) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(75,224,198,.28) 1px, transparent 1px);
        background-size: 58px 58px;
        mask-image: linear-gradient(to bottom, transparent, #000 24%, transparent 92%);
        animation: labGridDrift 22s linear infinite;
      }
      .ctms-lab-blueprint {
        position: absolute; width: min(70vw, 920px); height: auto;
        left: 50%; top: 48%; transform: translate(-50%,-50%);
        color: #a4fff0; opacity: .48; filter: drop-shadow(0 0 10px rgba(75,224,198,.45));
        animation: blueprintFloat 10s ease-in-out infinite alternate;
      }
      .ctms-lab-orbit {
        position: absolute; border: 1px solid rgba(255,188,125,.28); border-radius: 50%;
        width: 42vw; height: 42vw; min-width: 430px; min-height: 430px;
        right: -17vw; top: -19vw; transform: rotate(-24deg) scaleY(.5);
      }
      .ctms-lab-orbit::before, .ctms-lab-orbit::after {
        content: ''; position: absolute; border: 1px solid rgba(42,157,143,.16);
        border-radius: inherit; inset: 8%; animation: orbitPulse 5s ease-in-out infinite alternate;
      }
      .ctms-lab-orbit::after { inset: 18%; border-color: rgba(75,224,198,.26); animation-delay: -2.5s; }
      .ctms-lab-orbit-two { width: 26vw; height: 26vw; left: -12vw; right: auto; top: auto; bottom: -15vw; }
      .ctms-lab-readout {
        position: absolute; display: grid; gap: 4px; color: rgba(247,245,241,.45);
        font: 9px/1.3 var(--font-mono); letter-spacing: .12em;
        border-left: 1px solid rgba(255,188,125,.7); padding: 8px 12px;
        background: rgba(20,23,28,.48); backdrop-filter: blur(8px);
        box-shadow: 0 8px 28px rgba(0,0,0,.14);
      }
      .ctms-lab-readout strong { color: #cafff5; font-size: 10px; font-weight: 500; }
      .ctms-lab-readout i { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
        background: #54f0b0; box-shadow: 0 0 12px #54f0b0; margin-left: 4px;
        animation: readyPulse 1.8s ease-in-out infinite; }
      .ctms-lab-readout b { color: #E0A172; font-weight: 600; margin-left: 5px; }
      .ctms-readout-a { left: 8%; top: 23%; }
      .ctms-readout-b { right: 8%; bottom: 22%; }
      .ctms-lab-scan {
        position: absolute; top: -20%; left: 0; right: 0; height: 18%;
        background: linear-gradient(180deg, transparent, rgba(66,245,213,.15), rgba(66,245,213,.05), transparent);
        animation: labScan 7s linear infinite;
      }
      @keyframes labBreathe { to { transform: translate(18vw, 11vh) scale(1.32); opacity: .9; } }
      @keyframes labGridDrift { to { background-position: 0 174px, 0 0; } }
      @keyframes blueprintFloat { to { transform: translate(-50%, calc(-50% - 12px)) scale(1.025); opacity: .66; } }
      @keyframes labScan { to { transform: translateY(125vh); } }
      @keyframes orbitPulse { to { transform: scale(1.06); opacity: .7; } }
      @keyframes readyPulse { 50% { opacity: .45; box-shadow: 0 0 3px #54f0b0; } }
      @media (max-width: 700px) {
        .ctms-lab-blueprint { width: 112vw; left: 50%; top: 28%; opacity: .32; }
        .ctms-lab-readout { display: none; }
        .ctms-lab-grid { bottom: -62%; }
      }

      /* Respect reduced-motion preferences */
      @media (prefers-reduced-motion: reduce) {
        .ctms-rise, .ctms-fade, button {
          animation: none !important;
          transition: none !important;
        }
        .ctms-lab-glow, .ctms-lab-grid, .ctms-lab-blueprint, .ctms-lab-scan,
        .ctms-lab-orbit::before, .ctms-lab-orbit::after, .ctms-lab-readout i {
          animation: none !important;
        }
      }

      /* ── Table cell base (used across Dashboard panels) ────── */
      table { border-collapse: collapse; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
